name: 휴양림 빈자리 알림

on:
  schedule:
    # cron 은 UTC 기준입니다. KST = UTC + 9시간.
    # KST 07:00 ~ 23:55 에 5분마다 실행하려면 UTC 22:00~23:55 와 UTC 00:00~14:55 이 필요합니다.
    # (UTC 15:00~21:55 = KST 00:00~06:55 은 아예 실행하지 않습니다.)
    - cron: '*/5 22-23 * * *'   # KST 07:00 ~ 08:55
    - cron: '*/5 0-14 * * *'    # KST 09:00 ~ 23:55
  push:
    # 1회성 조회: 이 파일이 바뀌어 올라오면 한 번 실행합니다(Actions 버튼을 못 누를 때).
    paths:
      - 'config/oneoff.json'
  issues:
    # 1회성 조회: 소유자가 'oneoff 체크인,체크아웃 [lodging]' 제목으로 이슈를 열면 한 번 실행합니다.
    types: [opened]
  workflow_dispatch:            # Actions 탭에서 손으로 눌러 실행 (시간대 검사 무시)
    inputs:
      dump_html:
        description: "검색 결과 화면 HTML 발췌를 텔레그램으로 보내고 끝냅니다 (셀렉터를 알아낼 때만 켜세요)"
        required: false
        default: false
        type: boolean
      stay_range:
        description: "1회성 조회: 체크인,체크아웃 (예: 2026-11-19,2026-11-21). 비워두면 평소처럼 동작"
        required: false
        default: ''
        type: string
      lodging_all:
        description: "1회성(stay_range 와 함께): 전국, 숙박시설만(야영장 제외), 제외 지역 무시"
        required: false
        default: false
        type: boolean

# 같은 시각에 두 번 돌지 않도록 한 번에 하나만 실행합니다.
concurrency:
  group: forest-notify
  cancel-in-progress: false

permissions:
  contents: write   # 휴양림/휴장일 캐시를 레포에 되돌려 저장하기 위해 필요합니다.

jobs:
  notify:
    # 이슈 트리거는 소유자가 연 'oneoff' 이슈만 허용(공개 레포라 남이 실행하지 못하게).
    if: github.event_name != 'issues' || (github.actor == 'para333311' && startsWith(github.event.issue.title, 'oneoff '))
    runs-on: ubuntu-latest
    # 사이트가 느릴 때를 감안한 여유입니다. 로그인 재시도(최대 ~3분)와
    # 날짜별 검색(최대 ~5분)에 설치 단계까지 더하면 10분은 빠듯합니다.
    timeout-minutes: 15

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v5

      - name: 파이썬 준비
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 크롬(Chromium) 설치
        run: python -m playwright install --with-deps chromium

      - name: 실행 간 캐시 복원
        # 짧은 수명 캐시(직전 결과 해시, 휴장일 1시간 캐시)입니다.
        # 레포에 커밋하면 하루에 수십 개 커밋이 쌓이므로 Actions 캐시로만
        # 유지합니다. 매번 새 키로 저장하고(불변 캐시라 덮어쓸 수 없음),
        # restore-keys 접두사로 가장 최근 것을 찾아옵니다.
        uses: actions/cache/restore@v4
        with:
          path: |
            .last_seen.json
            config/holidays_cache.json
          key: runtime-state-${{ github.run_id }}
          restore-keys: |
            runtime-state-

      - name: 1회성 조회 요청 읽기
        if: github.event_name == 'push'
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          d = json.load(open('config/oneoff.json', encoding='utf-8'))
          print('ONEOFF_RANGE=' + str(d.get('stay_range', '')))
          print('ONEOFF_LODGING=' + ('true' if d.get('lodging_all') else ''))
          PY

      - name: 1회성 조회 요청 읽기 (이슈)
        if: github.event_name == 'issues'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os, re
          m = re.fullmatch(r'oneoff (\d{4}-\d{2}-\d{2}),(\d{4}-\d{2}-\d{2})( lodging)?', os.environ['ISSUE_TITLE'].strip())
          if not m:
              raise SystemExit('이슈 제목 형식: oneoff 2026-11-19,2026-11-21 lodging')
          print(f'ONEOFF_RANGE={m.group(1)},{m.group(2)}')
          print('ONEOFF_LODGING=' + ('true' if m.group(3) else ''))
          PY

      - name: 빈자리 조회 및 알림
        env:
          FOREST_ID: ${{ secrets.FOREST_ID }}
          FOREST_PW: ${{ secrets.FOREST_PW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DUMP_HTML: ${{ github.event.inputs.dump_html }}
          STAY_RANGE: ${{ github.event.inputs.stay_range || env.ONEOFF_RANGE }}
          STAY_LODGING_ALL: ${{ github.event.inputs.lodging_all || env.ONEOFF_LODGING }}
          PYTHONUNBUFFERED: '1'
        # 스크립트가 스스로 모든 오류를 잡아 텔레그램으로 알린 뒤, 조회가 실제로
        # 실패했으면 종료 코드 1 을 돌려줍니다. 그러면 이 단계가 실패로 표시되어
        # Actions 탭에서 실제 상태(성공/실패)를 그대로 볼 수 있습니다. 아래
        # 캐시 저장 단계들은 always() 로 걸려 있어 이 단계가 실패해도 계속
        # 실행되고, keepalive.yml 이 매주 커밋을 남기므로 실패가 쌓여도
        # GitHub 이 스케줄 자체를 끄지는 않습니다.
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            python scripts/notify.py --force
          else
            python scripts/notify.py
          fi

      - name: 실행 간 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .last_seen.json
            config/holidays_cache.json
          key: runtime-state-${{ github.run_id }}

      - name: 휴양림 목록 캐시 저장
        # 휴양림 목록(7일 캐시)이 바뀌었을 때만 레포에 되돌려 저장합니다.
        # 휴장일(1시간) 같은 짧은 캐시는 .gitignore 로 빠져 있어 여기서
        # 커밋되지 않습니다 — 커밋 노이즈를 막기 위함입니다.
        if: always()
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain config/)" ]; then
            echo "바뀐 설정이 없어 저장하지 않습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/
          git commit -m "chore: 휴양림 목록 캐시 갱신"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "푸시 재시도 ${i}회차"
            sleep $((2 ** i))
          done
          echo "캐시 저장에 실패했지만 알림 자체에는 영향이 없습니다."
